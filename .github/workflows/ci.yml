name: CI

# Run on every push (any branch) and every pull request.
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest # a clean, throwaway Ubuntu machine
    env:
      # `postinstall` runs `prisma generate`, which loads prisma.config.ts and requires
      # DATABASE_URL to resolve. generate never connects to a DB — this is a throwaway
      # placeholder, NOT a secret. Real connections use Neon/Vercel env vars.
      DATABASE_URL: "postgresql://user:password@localhost:5432/ledgerlens?schema=public"
    steps:
      - uses: actions/checkout@v4 # copy your repo onto the runner
      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0 # match your local Node
          cache: npm # cache ~/.npm for faster installs
      - run: npm ci # clean, exact install from package-lock.json
      - run: npm run lint # step 1
      - run: npm run typecheck # step 2
      - run: npm run test # step 3
